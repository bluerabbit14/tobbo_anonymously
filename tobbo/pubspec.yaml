name: Tobbo
description: "Ask anything. Get honest answers."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  google_fonts: ^6.3.2
  flutter_lucide: ^1.33.0
  share_plus: ^13.3.0
  http: ^1.6.0
  shared_preferences: ^2.5.5
  geolocator: ^14.0.3
  loading_animation_widget: ^1.3.0
  permission_handler: ^13.0.1
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/tobbo_icon.png
  adaptive_icon_background: "#033e42"
  adaptive_icon_foreground: assets/images/tobbo_splash.png
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

flutter_native_splash:
  color: "#033e42"
  image: assets/images/tobbo_splash.png
  color_dark: "#033e42"
  image_dark: assets/images/tobbo_splash.png
  android_12:
    color: "#033e42"
    image: assets/images/tobbo_splash.png
    icon_background_color: "#033e42"
    color_dark: "#033e42"
    image_dark: assets/images/tobbo_splash.png
    icon_background_color_dark: "#033e42"
  android: true
  ios: true
  web: false